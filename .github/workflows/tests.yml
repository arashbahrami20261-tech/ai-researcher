# Run the test suite on every push and pull request.
#
# No API key is needed: every test uses the FakeLLM provider from
# tests/conftest.py, and the one live network test is excluded by default
# via pytest.ini. That is deliberate — CI must never depend on a paid API
# or on arXiv being reachable.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Verify migrations apply to a clean database
        # Catches the case where a model is changed but no migration is
        # written for it — the schema would then silently drift from the code.
        run: |
          alembic upgrade head
          alembic check
